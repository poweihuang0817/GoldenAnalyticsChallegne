<rect x="990" y="365" width="400" height="150" rx="12" fill="#fff5df" stroke="#dac79c" stroke-width="2"/><text font-family="Segoe UI,Arial,sans-serif" x="1015" y="413" font-size="26" font-weight="600" fill="#172c39">DuckDB · extension</text><text font-family="Segoe UI,Arial,sans-serif" x="1015" y="452" font-size="19" fill="#53676b">Separately seeded local snapshot</text><text font-family="Segoe UI,Arial,sans-serif" x="1015" y="485" font-size="19" fill="#53676b">Embedded execution · native driver</text>
