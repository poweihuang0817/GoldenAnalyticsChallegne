<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="680" viewBox="0 0 1440 680" role="img" aria-labelledby="title desc">
<title id="title">Golden analytical query architecture</title><desc id="desc">The typed TypeScript API builds a constrained Substrait plan. Validation and relational lowering use Kysely to generate SQL for PostgreSQL, MySQL or DuckDB. The database executes the query and returns rows.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#678779"/></marker></defs>
<rect width="1440" height="680" rx="14" fill="#fff"/>
<text font-family="Segoe UI,Arial,sans-serif" x="50" y="47" font-size="16" letter-spacing="2" fill="#587465">NODE / TYPESCRIPT · QUERY CONSTRUCTION AND COMPILATION</text>
<rect x="50" y="80" width="365" height="150" rx="12" fill="#f0f5f1" stroke="#cddbd1" stroke-width="2"/><text font-family="Segoe UI,Arial,sans-serif" x="75" y="124" font-size="26" font-weight="600" fill="#172c39">Typed Table / Expr API</text><text font-family="Segoe UI,Arial,sans-serif" x="75" y="163" font-size="19" fill="#53676b">Filter · project · join · aggregate</text><text font-family="Segoe UI,Arial,sans-serif" x="75" y="196" font-size="19" fill="#53676b">Schema and result inference</text>
<path d="M420 155H505" stroke="#678779" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="515" y="80" width="365" height="150" rx="12" fill="#f0f5f1" stroke="#cddbd1" stroke-width="2"/><text font-family="Segoe UI,Arial,sans-serif" x="540" y="124" font-size="26" font-weight="600" fill="#172c39">Constrained Substrait</text><text font-family="Segoe UI,Arial,sans-serif" x="540" y="163" font-size="19" fill="#53676b">Backend-independent intent</text><text font-family="Segoe UI,Arial,sans-serif" x="540" y="196" font-size="19" fill="#53676b">Supported relational profile</text>
<path d="M885 155H970" stroke="#678779" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="980" y="80" width="410" height="150" rx="12" fill="#f0f5f1" stroke="#cddbd1" stroke-width="2"/><text font-family="Segoe UI,Arial,sans-serif" x="1005" y="124" font-size="26" font-weight="600" fill="#172c39">Validation + SQL lowering</text><text font-family="Segoe UI,Arial,sans-serif" x="1005" y="163" font-size="19" fill="#53676b">Scopes, types and query boundaries</text><text font-family="Segoe UI,Arial,sans-serif" x="1005" y="196" font-size="19" fill="#53676b">Kysely builds SQL + parameters</text>
