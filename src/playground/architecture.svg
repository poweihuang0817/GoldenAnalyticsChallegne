<text font-family="Segoe UI,Arial,sans-serif" x="50" y="268" font-size="16" letter-spacing="2" fill="#587465">EXECUTE ON THE SELECTED BACKEND</text>
<rect x="50" y="365" width="400" height="150" rx="12" fill="#f0f5f1" stroke="#cddbd1" stroke-width="2"/><text font-family="Segoe UI,Arial,sans-serif" x="75" y="413" font-size="26" font-weight="600" fill="#172c39">PostgreSQL 17</text><text font-family="Segoe UI,Arial,sans-serif" x="75" y="452" font-size="19" fill="#53676b">Remote Northwind database</text><text font-family="Segoe UI,Arial,sans-serif" x="75" y="485" font-size="19" fill="#53676b">PostgreSQL SQL · pg driver</text>
